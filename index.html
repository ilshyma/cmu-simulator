<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800">
<title>Mazda CMU Simulator</title>
<style>
@font-face { font-family: 'Tipperary'; src: url('Tipperary.ttf'); font-weight: normal; }
@font-face { font-family: 'Tipperary Semibold'; src: url('TipperarySemibold.ttf'); font-weight: 600; }
@font-face { font-family: 'Tipperary Bold'; src: url('TipperaryBold.ttf'); font-weight: bold; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #111; overflow: hidden; }

#cmu-frame {
  width: 800px; height: 480px;
  margin: 20px auto;
  position: relative; overflow: hidden;
  border: 2px solid #333; border-radius: 8px;
  box-shadow: 0 0 40px rgba(0,0,0,0.8);
  font-family: 'Tipperary', Arial, Helvetica, sans-serif;
  color: white; background: #000;
}
#bg {
  position: absolute; left: 0; top: 0;
  width: 800px; height: 480px;
  background: url('gui/common/images/background.png') no-repeat;
  z-index: 0;
}

/* Status Bar */
#statusbar {
  position: absolute; left: 0; top: 0;
  width: 800px; height: 64px;
  background: url('gui/common/controls/StatusBar/images/StatusBarBg.png') no-repeat;
  z-index: 10; display: flex; align-items: center;
}
#sb-home {
  width: 58px; height: 62px; margin: 1px 0 0 1px;
  background: url('gui/common/images/icons/IcnSbHome.png') center center no-repeat;
  cursor: pointer; display: none;
  flex-shrink: 0;
}
#sb-home:hover { opacity: 0.8; }
#sb-divider {
  width: 1px; height: 58px; margin-top: 1px;
  background: url('gui/common/controls/StatusBar/images/StatusBar_Divider.png') no-repeat;
  display: none; flex-shrink: 0;
}
#sb-domain-icon {
  width: 58px; height: 62px; margin-top: 1px;
  background-position: center center; background-repeat: no-repeat;
  display: none; flex-shrink: 0;
}
#sb-appname {
  height: 62px; line-height: 62px;
  font-size: 40px; font-family: 'Tipperary Semibold', Arial;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
}
#sb-clock {
  height: 62px; line-height: 62px; width: 114px;
  font-size: 26px; text-align: right;
  font-family: 'Tipperary Semibold', Arial;
  margin-right: 12px;
}

/* Left Button (Back) */
#leftbtn {
  position: absolute; left: 0; top: 64px;
  width: 94px; height: 416px;
  background: url('gui/common/controls/LeftBtn/images/BtnLeft_En.png') no-repeat;
  z-index: 8; cursor: pointer; display: none;
}
#leftbtn:hover { background-image: url('gui/common/controls/LeftBtn/images/BtnLeft_Focus.png'); }
#leftbtn:active { background-image: url('gui/common/controls/LeftBtn/images/BtnLeft_Hit.png'); }

/* Right Chrome */
#rightchrome {
  position: absolute; top: 64px; left: 766px;
  width: 37px; height: 416px;
  background: url('gui/common/controls/LeftBtn/images/ChromeArcRight.png') no-repeat;
  z-index: 8; display: none;
}

#content {
  position: absolute; left: 0; top: 0;
  width: 800px; height: 480px; z-index: 5;
}

/* ===== HOME ===== */
#home-screen {
  position: absolute; left: 0; top: 64px;
  width: 800px; height: 416px; overflow: hidden;
}
.home-ellipse {
  position: absolute; left: 0; top: 193px;
  width: 800px; height: 304px;
  background: url('gui/apps/system/controls/MainMenu/images/Ellipse.png') no-repeat;
}
.coin { position: absolute; cursor: pointer; transition: transform 0.2s linear; }
.coin:hover { transform: scale(1.15); }
.coin img { width: 100%; height: 100%; }
#coin-app { left: -35px; top: 272px; width: 114px; height: 122px; }
#coin-ent { left: 105px; top: 164px; width: 142px; height: 152px; }
#coin-com { left: 330px; top: 133px; width: 142px; height: 152px; }
#coin-nav { left: 549px; top: 164px; width: 142px; height: 152px; }
#coin-set { left: 721px; top: 272px; width: 114px; height: 122px; }
.coin-glow {
  position: absolute; width: 363px; height: 323px;
  background: url('gui/apps/system/controls/MainMenu/images/highlights/Glow.png') no-repeat;
  opacity: 0; transition: opacity 200ms linear; pointer-events: none;
}
#glow-app { left: -123px; top: 68px; }
#glow-ent { left: -5px; top: 13px; }
#glow-com { left: 220px; top: -18px; }
#glow-nav { left: 439px; top: 13px; }
#glow-set { left: 561px; top: 68px; }
.coin:hover + .coin-glow, .coin-glow.visible { opacity: 1; }
#home-label {
  position: absolute; top: 337px; left: 108px;
  width: 586px; height: 51px;
  text-align: center; line-height: 51px;
  font-size: 28px; color: white;
  opacity: 0; transition: opacity 200ms linear;
}

/* ===== LIST SCREEN ===== */
#list-screen {
  position: absolute; left: 0; top: 64px;
  width: 800px; height: 416px; display: none;
}

/* Tab Bar (Style4) */
#tab-bar {
  position: absolute; left: 8px; top: 0;
  width: 747px; height: 70px;
  display: none; z-index: 3;
}
.tab-arrow {
  position: absolute; top: 0;
  width: 86px; height: 70px; cursor: pointer;
  background: url('gui/common/controls/Tabs/images/Tab_StyleArrow.png') no-repeat;
  background-size: 100% 100%;
  display: flex; align-items: center; justify-content: center;
}
.tab-arrow:hover {
  background-image: url('gui/common/controls/Tabs/images/TabHighlight_Arrow.png');
}
.tab-arrow:active {
  background-image: url('gui/common/controls/Tabs/images/TabPress_Arrow.png');
}
.tab-arrow.disabled {
  pointer-events: none; opacity: 0.5;
}
#tab-arrow-left { left: 0; }
#tab-arrow-right { left: 656px; }
.tab-arrow-icon {
  width: 40px; height: 40px;
  background-repeat: no-repeat; background-position: center;
  background-size: contain;
}
#tab-slots { position: absolute; left: 0; top: 0; width: 747px; height: 70px; }
.tab-slot {
  position: absolute; top: 10px;
  width: 143px; height: 60px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-family: 'Tipperary', Arial;
  cursor: pointer; user-select: none;
  background-repeat: no-repeat; background-size: 100% 100%;
}
.tab-slot.active {
  background-image: url('gui/common/controls/Tabs/images/TabHighlight_Style04.png');
  color: white;
}
.tab-slot.inactive {
  background-image: url('gui/common/controls/Tabs/images/Tab_Style04.png');
  color: #000;
}
.tab-slot.inactive:hover {
  background-image: url('gui/common/controls/Tabs/images/TabPress_Style04.png');
}
#tab-mask {
  position: absolute; left: 3px; top: 69px;
  width: 741px; height: 1px;
  background: url('gui/common/controls/Tabs/images/TabBottomMask.png') no-repeat;
  background-size: 100% 100%;
}

/* List Container */
#list-container {
  position: absolute; left: 8px; top: 0;
  width: 732px; height: 416px;
  background: url('gui/common/controls/List2/images/ListBackground.png') 0% 100% no-repeat;
  background-size: 732px auto;
  overflow: hidden;
}
#list-scroller { position: relative; width: 100%; }

/* List Items */
.list-item {
  position: relative;
  width: 100%; height: 64px;
  cursor: pointer;
}
.list-item::after {
  content: ''; position: absolute;
  bottom: 0; left: 14px; right: 14px; height: 2px;
  background: url('gui/common/controls/List2/images/ListItemSeparator.png') repeat-x;
  background-size: auto 100%;
  pointer-events: none;
}
.list-item:hover {
  background: url('gui/common/controls/List2/images/ListFocus.png') no-repeat;
  background-size: 100% 100%;
}
.list-item:active {
  background: url('gui/common/controls/List2/images/ListFocus_Press.png') no-repeat;
  background-size: 100% 100%;
}
.list-item.disabled { opacity: 0.4; pointer-events: none; }

.list-item .item-text {
  position: absolute; left: 71px; top: 0;
  height: 64px; line-height: 64px;
  font-size: 33px; color: white;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  width: 595px;
}
.list-item .item-icon {
  position: absolute; left: 18px; top: 5px;
  width: 53px; height: 53px;
  background-size: contain; background-repeat: no-repeat; background-position: center;
}
.list-item .item-caret {
  position: absolute; left: 666px; top: 22px;
  width: 10px; height: 20px;
  background: url('gui/common/controls/List2/images/Caret.png') no-repeat;
  background-size: contain;
}

/* style03 (radio) */
.list-item .item-radio {
  position: absolute; left: 18px; top: 5px;
  width: 53px; height: 53px;
  background-size: contain; background-repeat: no-repeat; background-position: center;
}

/* style06 (text + label) */
.list-item.style06 .item-text { width: 456px; }
.list-item.style06 .item-label {
  position: absolute; left: 527px; top: 0;
  height: 64px; line-height: 64px;
  font-size: 28px; color: rgba(255,255,255,0.7);
  white-space: nowrap;
}

/* style10 (2 inline buttons) */
.list-item.style10 .item-text { width: 364px; }
.list-item.style10 .item-buttons {
  position: absolute; left: 435px; top: 8px;
  width: 236px; height: 48px; display: flex;
}

/* style11 (3 inline buttons) */
.list-item.style11 .item-text { width: 244px; }
.list-item.style11 .item-buttons {
  position: absolute; left: 316px; top: 8px;
  width: 354px; height: 48px; display: flex;
}

.inline-btn {
  width: 118px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-family: 'Tipperary', Arial;
  cursor: pointer; user-select: none;
  background-repeat: no-repeat; background-size: 100% 100%;
  background-image: url('gui/common/controls/List2/images/InLineButton.png');
  color: #c8c8c8;
}
.inline-btn.active {
  background-image: url('gui/common/controls/List2/images/InLineButton_Selected.png');
  color: white;
}
.inline-btn:active {
  background-image: url('gui/common/controls/List2/images/InLineButton_Hit.png');
}

/* style12 (slider) - matches firmware List2Ctrl.css */
.list-item.style12 .item-text { width: 241px; }
.list-item.style12 .item-slider {
  position: absolute; left: 312px; top: 1px;
  width: 364px; height: 64px;
}
.item-slider .slider-track {
  position: absolute; left: 9px; top: 34px;
  width: 346px; height: 13px;
  background: url('gui/common/controls/List2/images/ListItem_SliderBG-1.png') 50% 50% no-repeat;
}
.item-slider .slider-fill {
  position: absolute; left: 1px; top: 1px;
  height: 11px; overflow: hidden;
}
.item-slider .slider-fill-inner {
  width: 344px; height: 8px;
  background: url('gui/common/controls/List2/images/ListItem_Slider-1.png') left center no-repeat;
}
.item-slider .slider-knob {
  position: absolute;
  width: 43px; height: 43px; top: -15px;
  background: url('gui/common/controls/List2/images/ListItem_Slider_Knob.png') 50% 50% no-repeat;
}
.item-slider .slider-tick {
  position: absolute; top: -6px;
  width: 2px; height: 5px;
  background: url('gui/common/controls/List2/images/List_SliderTick.png') center no-repeat;
}
.item-slider .slider-center-top {
  position: absolute; top: -9px; width: 2px; height: 8px;
  background: url('gui/common/controls/List2/images/List_SliderTickCtr.png') center no-repeat;
}
.item-slider .slider-center-bottom {
  position: absolute; top: 14px; width: 2px; height: 8px;
  background: url('gui/common/controls/List2/images/List_SliderTickCtr.png') center no-repeat;
}
.item-slider .slider-label-left {
  position: absolute; top: -28px; left: 0; width: 167px; height: 24px;
  font-size: 21px; text-align: left; line-height: 20px; color: white;
}
.item-slider .slider-label-right {
  position: absolute; top: -28px; left: 180px; width: 167px; height: 24px;
  font-size: 21px; text-align: right; line-height: 20px; color: white;
}
.item-slider .slider-label-center {
  position: absolute; top: -28px; left: 167px; width: 12px; height: 24px;
  font-size: 21px; text-align: center; line-height: 20px; color: white;
}

/* Scrollbar */
#list-scrollbar-track {
  position: absolute; right: 12px; top: 10px;
  width: 8px; height: 396px;
  background: url('gui/common/controls/List2/images/ScrollbarBg.png') repeat-y;
  display: none; z-index: 4;
}
#list-scrollbar-thumb {
  width: 8px; min-height: 40px;
  background: url('gui/common/controls/List2/images/Scrollbar.png') repeat-y;
  border-radius: 4px;
}

/* ===== DIALOG ===== */
#dialog-screen {
  position: absolute; left: 0; top: 0;
  width: 800px; height: 480px;
  background: rgba(0,0,0,0.7);
  display: none; z-index: 20;
  flex-direction: column;
  align-items: center; justify-content: center;
}
.dialog-box {
  width: 600px; padding: 30px;
  background: rgba(30,30,30,0.95);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px; text-align: center;
}
.dialog-title { font-size: 28px; font-family: 'Tipperary Semibold', Arial; margin-bottom: 16px; }
.dialog-text { font-size: 20px; line-height: 1.5; color: rgba(255,255,255,0.8); margin-bottom: 24px; white-space: pre-line; }
.dialog-buttons { display: flex; gap: 16px; justify-content: center; }
.dialog-btn {
  padding: 12px 32px; font-size: 20px; font-family: 'Tipperary', Arial; color: white;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 4px; cursor: pointer;
}
.dialog-btn:hover { background: rgba(255,255,255,0.2); }
.dialog-btn.primary { background: rgba(80,130,200,0.4); border-color: rgba(80,130,200,0.6); }

/* ===== TUNER ===== */
#tuner-screen {
  position: absolute; left: 0; top: 64px;
  width: 800px; height: 416px; display: none;
}
.tuner-display {
  position: absolute; left: 94px; top: 0;
  width: 672px; height: 300px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.tuner-band { font-size: 20px; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
.tuner-freq { font-size: 72px; font-family: 'Tipperary Semibold', Arial; }
.tuner-station { font-size: 22px; color: rgba(255,255,255,0.7); margin-top: 8px; }
.tuner-presets {
  position: absolute; left: 94px; bottom: 0;
  width: 672px; height: 116px;
  display: flex; align-items: center; justify-content: space-around;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.tuner-preset {
  width: 80px; height: 80px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer; border-radius: 4px; font-size: 18px;
}
.tuner-preset:hover { background: rgba(255,255,255,0.1); }
.tuner-preset .preset-num { font-size: 14px; color: rgba(255,255,255,0.5); }

/* ===== NOW PLAYING ===== */
#nowplaying-screen {
  position: absolute; left: 0; top: 64px;
  width: 800px; height: 416px; display: none;
}
.np-artwork {
  position: absolute; left: 94px; top: 20px;
  width: 180px; height: 180px;
  background: url('gui/common/images/no_artwork_icon.png') center no-repeat;
  background-size: contain; border: 1px solid rgba(255,255,255,0.1);
}
.np-info { position: absolute; left: 290px; top: 30px; width: 420px; }
.np-title { font-size: 26px; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-artist { font-size: 20px; color: rgba(255,255,255,0.7); margin-bottom: 4px; }
.np-album { font-size: 18px; color: rgba(255,255,255,0.5); }
.np-controls {
  position: absolute; left: 94px; bottom: 20px;
  width: 672px; height: 60px;
  display: flex; align-items: center; justify-content: center; gap: 40px;
}
.np-btn {
  width: 48px; height: 48px; cursor: pointer;
  background-repeat: no-repeat; background-position: center;
  background-size: contain; opacity: 0.8;
}
.np-btn:hover { opacity: 1; }

/* ===== DIAL PAD ===== */
#dialpad-screen {
  position: absolute; left: 0; top: 64px;
  width: 800px; height: 416px; display: none;
}
.dialpad-display {
  position: absolute; left: 94px; top: 10px;
  width: 672px; height: 60px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; font-family: 'Tipperary Semibold', Arial;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.dialpad-grid {
  position: absolute; left: 200px; top: 80px;
  display: grid; grid-template-columns: repeat(3, 120px); gap: 8px;
}
.dialpad-key {
  width: 120px; height: 70px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer; border-radius: 4px; font-size: 28px;
}
.dialpad-key:hover { background: rgba(255,255,255,0.1); }
.dialpad-key .key-sub { font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 2px; }
.dialpad-call {
  position: absolute; left: 320px; bottom: 20px;
  width: 160px; height: 50px;
  background: rgba(40,160,40,0.6); border: 1px solid rgba(40,160,40,0.8);
  border-radius: 25px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: white;
}
.dialpad-call:hover { background: rgba(40,160,40,0.8); }
</style>
</head>
<body>
<div id="cmu-frame">
  <div id="bg"></div>
  <div id="statusbar">
    <div id="sb-home" onclick="navigateTo('home')"></div>
    <div id="sb-divider"></div>
    <div id="sb-domain-icon"></div>
    <div id="sb-appname"></div>
    <div id="sb-clock"></div>
  </div>
  <div id="leftbtn" onclick="goBack()"></div>
  <div id="rightchrome"></div>

  <div id="content">
    <!-- Home -->
    <div id="home-screen">
      <div class="home-ellipse"></div>
      <div id="coin-app" class="coin" onmouseenter="showLabel('Applications')" onmouseleave="hideLabel()" onclick="navigateTo('applications')">
        <img src="gui/apps/system/controls/MainMenu/images/coins/HomeApps.png">
      </div><div id="glow-app" class="coin-glow"></div>
      <div id="coin-ent" class="coin" onmouseenter="showLabel('Entertainment')" onmouseleave="hideLabel()" onclick="navigateTo('entertainment')">
        <img src="gui/apps/system/controls/MainMenu/images/coins/HomeAudio.png">
      </div><div id="glow-ent" class="coin-glow"></div>
      <div id="coin-com" class="coin" onmouseenter="showLabel('Communication')" onmouseleave="hideLabel()" onclick="navigateTo('communication')">
        <img src="gui/apps/system/controls/MainMenu/images/coins/HomeCom.png">
      </div><div id="glow-com" class="coin-glow"></div>
      <div id="coin-nav" class="coin" onmouseenter="showLabel('Navigation')" onmouseleave="hideLabel()" onclick="navigateTo('navigation')">
        <img src="gui/apps/system/controls/MainMenu/images/coins/HomeNav.png">
      </div><div id="glow-nav" class="coin-glow"></div>
      <div id="coin-set" class="coin" onmouseenter="showLabel('Settings')" onmouseleave="hideLabel()" onclick="navigateTo('settings')">
        <img src="gui/apps/system/controls/MainMenu/images/coins/HomeSet.png">
      </div><div id="glow-set" class="coin-glow"></div>
      <div id="home-label"></div>
    </div>

    <!-- List Screen (also used for settings with tabs) -->
    <div id="list-screen">
      <div id="tab-bar">
        <div id="tab-arrow-left" class="tab-arrow">
          <div class="tab-arrow-icon" id="tab-arrow-left-icon"></div>
        </div>
        <div id="tab-slots"></div>
        <div id="tab-arrow-right" class="tab-arrow">
          <div class="tab-arrow-icon" id="tab-arrow-right-icon"></div>
        </div>
        <div id="tab-mask"></div>
      </div>
      <div id="list-container">
        <div id="list-scroller"></div>
      </div>
      <div id="list-scrollbar-track">
        <div id="list-scrollbar-thumb"></div>
      </div>
    </div>

    <!-- Tuner -->
    <div id="tuner-screen">
      <div class="tuner-display">
        <div class="tuner-band">FM</div>
        <div class="tuner-freq">98.5</div>
        <div class="tuner-station">WNCX Classic Rock</div>
      </div>
      <div class="tuner-presets">
        <div class="tuner-preset"><span class="preset-num">1</span>98.5</div>
        <div class="tuner-preset"><span class="preset-num">2</span>100.7</div>
        <div class="tuner-preset"><span class="preset-num">3</span>102.1</div>
        <div class="tuner-preset"><span class="preset-num">4</span>104.1</div>
        <div class="tuner-preset"><span class="preset-num">5</span>106.5</div>
        <div class="tuner-preset"><span class="preset-num">6</span>107.9</div>
      </div>
    </div>

    <!-- Now Playing -->
    <div id="nowplaying-screen">
      <div class="np-artwork"></div>
      <div class="np-info">
        <div class="np-title">Track Name</div>
        <div class="np-artist">Artist Name</div>
        <div class="np-album">Album Name</div>
      </div>
      <div class="np-controls">
        <div class="np-btn" style="background-image:url('gui/common/images/icons/IcnUmpPreviousAudio_Ds.png')"></div>
        <div class="np-btn" style="background-image:url('gui/common/images/icons/IcnUmpPlayOrPause_En.png');width:56px;height:56px"></div>
        <div class="np-btn" style="background-image:url('gui/common/images/icons/IcnUmpNextAudio_En.png')"></div>
      </div>
    </div>

    <!-- Dial Pad -->
    <div id="dialpad-screen">
      <div class="dialpad-display" id="dial-display">_</div>
      <div class="dialpad-grid">
        <div class="dialpad-key" onclick="dialKey('1')">1<span class="key-sub">&nbsp;</span></div>
        <div class="dialpad-key" onclick="dialKey('2')">2<span class="key-sub">ABC</span></div>
        <div class="dialpad-key" onclick="dialKey('3')">3<span class="key-sub">DEF</span></div>
        <div class="dialpad-key" onclick="dialKey('4')">4<span class="key-sub">GHI</span></div>

  const now = new Date();
  let h = now.getHours(), m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('sb-clock').textContent = h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
}

}

function showStatusBar(title, showHome, showBack, domainIcon) {
  document.getElementById('sb-home').style.display = showHome ? 'block' : 'none';
  document.getElementById('sb-divider').style.display = showHome ? 'block' : 'none';
  const iconEl = document.getElementById('sb-domain-icon');
  if (domainIcon) {
    iconEl.style.backgroundImage = "url('gui/common/images/icons/" + domainIcon + "')";
    iconEl.style.display = 'block';
  } else {
    iconEl.style.display = 'none';
  }
  document.getElementById('sb-appname').textContent = title || '';
  document.getElementById('leftbtn').style.display = showBack ? 'block' : 'none';
  document.getElementById('rightchrome').style.display = showBack ? 'block' : 'none';
}

function navigateTo(screenId) {
  if (currentScreen !== screenId) navStack.push(currentScreen);
  currentScreen = screenId;
  renderScreen(screenId);
}

function goBack() {
  if (navStack.length > 0) {
    currentScreen = navStack.pop();
    renderScreen(currentScreen);
  } else {
    currentScreen = 'home';
    renderScreen('home');
  }
}

function getDomainIcon(screenId) {
  if (DOMAIN_ICONS[screenId]) return DOMAIN_ICONS[screenId];
  for (const [domain, icon] of Object.entries(DOMAIN_ICONS)) {
    if (screenId.startsWith(domain + '-') || screenId.startsWith('veh-') || screenId.startsWith('settings-')) return DOMAIN_ICONS.settings;
  }
  const stack = [...navStack];
  while (stack.length) {
    const parent = stack.pop();
    if (DOMAIN_ICONS[parent]) return DOMAIN_ICONS[parent];
  }
  return null;
}

function renderScreen(screenId) {
  hideAllScreens();

  if (screenId === 'home') {
    showStatusBar('', false, false);
    document.getElementById('home-screen').style.display = 'block';
    return;
  }

  if (screenId === 'settings') {
    renderSettingsScreen();
    return;
  }

  const icon = getDomainIcon(screenId);
  const menu = MENUS[screenId];
  if (!menu) {
    showStatusBar(screenId, true, true, icon);
    return;
  }

  if (menu.special === 'tuner') {
    showStatusBar(menu.title, true, true, icon);
    document.getElementById('tuner-screen').style.display = 'block';
    document.querySelector('.tuner-band').textContent = menu.band;
    document.querySelector('.tuner-freq').textContent = menu.freq;
    return;
  }
  if (menu.special === 'nowplaying') {
    showStatusBar(menu.title, true, true, icon);
    document.getElementById('nowplaying-screen').style.display = 'block';
    return;
  }
  if (menu.special === 'dialpad') {
    showStatusBar(menu.title, true, true, icon);
    dialNumber = '';
    document.getElementById('dial-display').textContent = '_';
    document.getElementById('dialpad-screen').style.display = 'block';
    return;
  }
  if (menu.special === 'dialog') {
    showStatusBar(menu.title, true, true, icon);
    document.getElementById('dialog-title').textContent = menu.dialogTitle;
    document.getElementById('dialog-text').textContent = menu.dialogText;
    document.getElementById('dialog-buttons').innerHTML = '<div class="dialog-btn primary" onclick="goBack()">OK</div>';
    document.getElementById('dialog-screen').style.display = 'flex';
    return;
  }

  showStatusBar(menu.title, true, true, icon);
  renderListScreen(menu.items, screenId, false);
}

// ===== SETTINGS WITH TABS =====
function renderSettingsScreen() {
  showStatusBar('Settings', true, true, 'IcnSbnSettings.png');
  document.getElementById('list-screen').style.display = 'block';
  hasTabs = true;

  renderTabBar();

  const tab = SETTINGS_TABS[currentSettingsTab];
  renderListScreen(tab.items, 'settings-tab-' + currentSettingsTab, true);
}

function renderTabBar() {
  const tabBar = document.getElementById('tab-bar');
  tabBar.style.display = 'block';
  const hasLeftBtn = document.getElementById('leftbtn').style.display === 'block';
  tabBar.style.left = (hasLeftBtn ? 102 : 8) + 'px';

  const leftIcon = document.getElementById('tab-arrow-left-icon');
  const rightIcon = document.getElementById('tab-arrow-right-icon');
  const leftArrow = document.getElementById('tab-arrow-left');
  const rightArrow = document.getElementById('tab-arrow-right');

  if (settingsTabOffset > 0) {
    leftIcon.style.backgroundImage = "url('gui/common/controls/Tabs/images/Tab_ArrowLeft.png')";
    leftArrow.classList.remove('disabled');
    leftArrow.onclick = () => { settingsTabOffset--; renderSettingsScreen(); };
  } else {
    leftIcon.style.backgroundImage = "url('gui/common/controls/Tabs/images/Tab_ArrowLeft_Ds.png')";
    leftArrow.classList.add('disabled');
    leftArrow.onclick = null;
  }

  if (settingsTabOffset + 4 < SETTINGS_TABS.length) {
    rightIcon.style.backgroundImage = "url('gui/common/controls/Tabs/images/Tab_ArrowRight.png')";
    rightArrow.classList.remove('disabled');
    rightArrow.onclick = () => { settingsTabOffset++; renderSettingsScreen(); };
  } else {
    rightIcon.style.backgroundImage = "url('gui/common/controls/Tabs/images/Tab_ArrowRight_Ds.png')";
    rightArrow.classList.add('disabled');
    rightArrow.onclick = null;
  }

  const slots = document.getElementById('tab-slots');
  slots.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const tabIdx = settingsTabOffset + i;
    if (tabIdx >= SETTINGS_TABS.length) break;
    const tab = SETTINGS_TABS[tabIdx];
    const isActive = tabIdx === currentSettingsTab;
    const slot = document.createElement('div');
    slot.className = 'tab-slot ' + (isActive ? 'active' : 'inactive');
    slot.style.left = (86 + i * 143) + 'px';
    slot.textContent = tab.label;
    slot.onclick = ((idx) => () => {
      currentSettingsTab = idx;
      renderSettingsScreen();
    })(tabIdx);
    slots.appendChild(slot);
  }
}

// ===== LIST RENDERING =====
function renderListScreen(items, screenId, withTabs) {
  document.getElementById('list-screen').style.display = 'block';

  const container = document.getElementById('list-container');
  const scroller = document.getElementById('list-scroller');
  const trackEl = document.getElementById('list-scrollbar-track');

  const hasLeftBtn = document.getElementById('leftbtn').style.display === 'block';
  const leftOffset = hasLeftBtn ? 102 : 8;
  container.style.left = leftOffset + 'px';

  if (withTabs) {
    container.style.top = '69px';
    container.style.height = '347px';
    trackEl.style.top = '79px';
    trackEl.style.height = '327px';
  } else {
    container.style.top = '0';
    container.style.height = '416px';
    trackEl.style.top = '10px';
    trackEl.style.height = '396px';
  }

  scroller.innerHTML = '';
  scroller.style.transform = 'translateY(0)';
  listScrollPos = 0;

  const visibleItems = items.filter(it => !it.hidden);
  visibleItems.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'list-item';
    if (item.disabled) div.classList.add('disabled');

    let style = 'style01';
    if (item.radio) style = 'style03';
    else if (item.toggle && item.toggle.length >= 3) style = 'style11';
    else if (item.toggle) style = 'style10';
    else if (item.slider) style = 'style12';
    else if (item.label !== undefined && !item.target) style = 'style06';
    else if (item.label !== undefined && item.target) style = 'style06';

    div.classList.add(style);
    let html = '';

    if (style === 'style03') {
      const img = item.checked ? 'IcnListRadio_Checked_En' : 'IcnListRadio_Unchecked_En';
      html += '<div class="item-radio" style="background-image:url(\'gui/common/images/icons/' + img + '.png\')"></div>';
      html += '<div class="item-text">' + item.text + '</div>';
    } else if (style === 'style10' || style === 'style11') {
      html += '<div class="item-text">' + item.text + '</div>';
      html += '<div class="item-buttons">';
      item.toggle.forEach((t, i) => {
        html += '<div class="inline-btn' + (i === item.value ? ' active' : '') + '" data-idx="' + i + '">' + t + '</div>';
      });
      html += '</div>';
    } else if (style === 'style12') {
      const pct = item.value !== undefined ? item.value : 50;
      const fillW = Math.round((pct / 100) * 344);
      const knobL = Math.round((pct / 100) * 344 - 20.5);
      html += '<div class="item-text">' + item.text + '</div>';
      html += '<div class="item-slider">';
      html += '<div class="slider-track">';
      if (item.tickMarks && item.min !== undefined) {
        const range = item.max - item.min;
        const trackW = 346;
        const usable = trackW - 4;
        const tickSpacing = usable / range;
        const centerIdx = Math.floor(range / 2);
        const hasCenterMark = (range % 2 === 0);
        html += '<div class="slider-label-left">−</div>';
        html += '<div class="slider-label-center">0</div>';
        html += '<div class="slider-label-right">+</div>';
        if (hasCenterMark) {
          const cLeft = Math.round(centerIdx * tickSpacing + 1);
          html += '<div class="slider-center-top" style="left:' + cLeft + 'px"></div>';
          html += '<div class="slider-center-bottom" style="left:' + cLeft + 'px"></div>';
        }
        for (let t = 0; t <= range; t++) {
          if (hasCenterMark && t === centerIdx) continue;
          const tLeft = Math.round(t * tickSpacing + 1);
          html += '<div class="slider-tick" style="left:' + tLeft + 'px"></div>';
        }
      }
      html += '<div class="slider-fill" style="width:' + fillW + 'px"><div class="slider-fill-inner"></div></div>';
      html += '<div class="slider-knob" style="left:' + knobL + 'px"></div>';
      html += '</div>';
      html += '</div>';
    } else if (style === 'style06') {
      html += '<div class="item-text">' + item.text + '</div>';
      html += '<div class="item-label">' + item.label + '</div>';
      if (item.target) html += '<div class="item-caret"></div>';
    } else {
      if (item.icon) html += '<div class="item-icon" style="background-image:url(\'gui/common/images/icons/' + item.icon + '.png\')"></div>';
      html += '<div class="item-text">' + item.text + '</div>';
      if (item.target) html += '<div class="item-caret"></div>';
    }

    div.innerHTML = html;

    if (item.target && !item.disabled) {
      div.addEventListener('click', (e) => {
        if (e.target.classList.contains('inline-btn')) return;
        navigateTo(item.target);
      });
    }
    if (item.radio && !item.disabled) {
      div.addEventListener('click', () => {
        visibleItems.forEach(it => { if (it.radio) it.checked = false; });
        item.checked = true;
        renderListScreen(items, screenId, withTabs);
      });
    }

    const btns = div.querySelectorAll('.inline-btn');
    btns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const newVal = parseInt(btn.getAttribute('data-idx'));
        item.value = newVal;
        btns.forEach((b, bi) => {
          b.classList.toggle('active', bi === newVal);
        });
      });
    });

    scroller.appendChild(div);
  });

  const listHeight = withTabs ? 347 : 416;
  const totalHeight = visibleItems.length * 64;
  if (totalHeight > listHeight) {
    trackEl.style.display = 'block';
    const trackH = withTabs ? 327 : 396;
    const thumbHeight = Math.max(40, (listHeight / totalHeight) * trackH);
    document.getElementById('list-scrollbar-thumb').style.height = thumbHeight + 'px';
  } else {
    trackEl.style.display = 'none';
  }

  container.onwheel = (e) => {
    e.preventDefault();
    const maxScroll = Math.max(0, totalHeight - listHeight);
    listScrollPos = Math.max(0, Math.min(maxScroll, listScrollPos + e.deltaY));
    scroller.style.transform = 'translateY(-' + listScrollPos + 'px)';
    if (totalHeight > listHeight) {
      const trackH = withTabs ? 327 : 396;
      const thumbH = parseInt(document.getElementById('list-scrollbar-thumb').style.height);
      const thumbTravel = trackH - thumbH;
      document.getElementById('list-scrollbar-thumb').style.marginTop =
        (listScrollPos / maxScroll * thumbTravel) + 'px';
    }
  };
}

// Coin glow effects
document.querySelectorAll('.coin').forEach(coin => {
  const id = coin.id.replace('coin-', '');
  const glow = document.getElementById('glow-' + id);
  coin.addEventListener('mouseenter', () => glow.classList.add('visible'));
  coin.addEventListener('mouseleave', () => glow.classList.remove('visible'));
});

renderScreen('home');
</script>
